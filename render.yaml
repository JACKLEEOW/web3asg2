# Render Blueprint: SPA fallback so client routes (e.g. /playlists) are not 404 on refresh.
# Sync this file in the Render Dashboard (Blueprint) or add the same rule manually:
# Redirects/Rewrites → Source /* → Destination /index.html → Action Rewrite
services:
  - type: web
    name: web2
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
